<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Leads — WTPESTORE (Owner Tool)</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#eef2f6;color:#0f1111}
.top{background:#0b2545;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px}
.top img{height:38px;width:auto}.top .t{font-size:15px;font-weight:800}.top .t span{display:block;font-size:11px;font-weight:500;color:#9fc2d8}
.wrap{max-width:820px;margin:0 auto;padding:14px}
.bar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.bar input{flex:1;min-width:180px;padding:12px 14px;border:1px solid #cdd8e2;border-radius:10px;font-size:14px;background:#fff}
.btn{border:none;border-radius:9px;padding:9px 12px;font-size:12.5px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px;justify-content:center}
.b-nav{background:#0b2545;color:#fff}.b-cfg{background:#eef2f6;color:#0b2545;border:1px solid #cdd8e2}
.count{font-size:12.5px;color:#5b6b78;margin:2px 0 10px}
.lead{background:#fff;border:1px solid #e2e9f0;border-radius:12px;padding:13px 15px;margin-bottom:10px}
.lead.done{opacity:.5}
.l-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.l-name{font-size:15px;font-weight:800;color:#0b2545}
.l-date{font-size:11.5px;color:#8a97a3;white-space:nowrap}
.l-prod{font-size:13.5px;color:#0b2545;margin:4px 0;font-weight:600}
.l-meta{font-size:12.5px;color:#5b6b78;line-height:1.55}
.l-msg{font-size:12px;color:#5b6b78;background:#f6f9fb;border-radius:7px;padding:6px 9px;margin:7px 0 0;line-height:1.45}
.l-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.b-q{background:#f59e0b;color:#fff}.b-d{background:#0e7490;color:#fff}.b-c{background:#6d28d9;color:#fff}
.b-cl{background:#0b2545;color:#fff}.b-em{background:#1a73e8;color:#fff}.b-ok{background:#eef2f6;color:#146a45;border:1px solid #b9e6cd}
.pill{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;margin-top:5px;display:inline-block}
.pill.n{background:#f1f3f5;color:#8a97a3}
.loading{text-align:center;color:#5b6b78;padding:40px 0;font-size:14px}
.cfg{background:#fff6e6;border:1px solid #ffe0a3;border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.7;color:#5a4300;margin-bottom:12px;display:none}
.cfg.on{display:block}.cfg label{font-weight:700;font-size:12px}.cfg input{width:100%;padding:10px;border:1px solid #e2c98a;border-radius:8px;margin:6px 0 10px;font-size:12.5px}
.cfg button{background:#0b2545;color:#fff;border:none;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#0b2545;color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
.toast.on{opacity:1}
/* reply modal */
.ov{position:fixed;inset:0;background:rgba(6,18,33,.6);display:none;align-items:flex-end;justify-content:center;z-index:120}
.ov.on{display:flex}
.rp{background:#fff;border-radius:16px 16px 0 0;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:16px}
@media(min-width:560px){.ov{align-items:center}.rp{border-radius:16px}}
.rp h3{margin:0 0 3px;font-size:16px;color:#0b2545}.rp .sub{font-size:12px;color:#5b6b78;margin-bottom:10px}
.rp textarea{width:100%;min-height:200px;border:1px solid #cdd8e2;border-radius:10px;padding:12px;font-size:13.5px;line-height:1.6;font-family:inherit;resize:vertical}
.rp .row{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.rp .b-wa{background:#25d366;color:#fff}.rp .b-em{background:#1a73e8;color:#fff}.rp .b-x{background:#eef2f6;color:#0b2545}
.b-pdf{background:#b3261e;color:#fff}
/* quote overlay */
.qov{position:fixed;inset:0;background:rgba(6,18,33,.6);display:none;align-items:flex-start;justify-content:center;z-index:130;overflow:auto;padding:14px}
.qov.on{display:flex}
.qwrap{background:#eef2f6;border-radius:14px;max-width:820px;width:100%;padding:12px}
.qctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:10px}
.qctrl label{font-size:11px;font-weight:700;color:#5b6b78;display:block;margin-bottom:3px}
.qctrl input{width:110px;padding:8px;border:1px solid #cdd8e2;border-radius:8px;font-size:14px}
.qctrl input.wide{width:200px}
.qbtns{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.qbtns .b-dl{background:#b3261e;color:#fff}.qbtns .b-pr{background:#0b2545;color:#fff}.qbtns .b-x{background:#eef2f6;color:#0b2545;border:1px solid #cdd8e2}
#quoteDoc{background:#fff;color:#0f1111;padding:28px 30px;font-size:13px;line-height:1.55;border-radius:6px}
#quoteDoc .hd{display:flex;justify-content:space-between;border-bottom:2px solid #0b2545;padding-bottom:10px;margin-bottom:12px}
#quoteDoc .hd .co{font-size:18px;font-weight:800;color:#0b2545}
#quoteDoc .hd .co small{display:block;font-size:11px;font-weight:600;color:#e67e22}
#quoteDoc .muted{color:#555;font-size:11.5px}
#quoteDoc h2{font-size:15px;color:#0b2545;margin:10px 0 8px;letter-spacing:.5px}
#quoteDoc table{width:100%;border-collapse:collapse;margin:8px 0}
#quoteDoc th,#quoteDoc td{border:1px solid #cdd8e2;padding:7px 9px;font-size:12px;text-align:left}
#quoteDoc th{background:#0b2545;color:#fff}
#quoteDoc td.r,#quoteDoc th.r{text-align:right}
#quoteDoc .tot td{font-weight:700}
#quoteDoc .terms{font-size:11px;color:#444;margin-top:10px;line-height:1.6}
/* gate */
#gate{position:fixed;inset:0;background:#0b2545;display:flex;align-items:center;justify-content:center;z-index:200}
#gate .g{background:#fff;border-radius:16px;padding:30px;width:300px;text-align:center}
#gate h2{color:#0b2545;font-size:18px;margin:6px 0}#gate p{font-size:12.5px;color:#5b6b78;margin-bottom:14px}
#gate input{text-align:center;font-size:20px;letter-spacing:6px;width:100%;padding:11px;border:1px solid #cdd8e2;border-radius:9px}
#gate button{margin-top:12px;width:100%;background:#25d366;color:#fff;border:none;padding:12px;border-radius:9px;font-weight:700;font-size:15px;cursor:pointer}
#pinerr{color:#b3261e;font-size:12.5px;margin-top:8px;display:none}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
<div id="gate"><div class="g">
<div style="font-size:34px">🔒</div><h2>Staff Login</h2><p>Apna naam aur password daalein</p>
<input id="uName" type="text" placeholder="Aapka naam" style="text-align:left;letter-spacing:normal;font-size:15px;margin-bottom:9px" onkeydown="if(event.key==='Enter')document.getElementById('pin').focus()">
<input id="pin" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')unlock()">
<button onclick="unlock()">Unlock</button><div id="pinerr">Wrong password</div>
</div></div>

<div class="top">
  <img src="/icons/logo-white.png" alt="WTPeSTORE">
  <div class="t">Leads (IndiaMART)<span id="whoami">Owner tool · quick reply (auto-price) · WhatsApp / Email</span></div>
  <button onclick="logout()" style="margin-left:auto;background:transparent;border:1px solid #35507a;color:#cfe1f0;font-size:11.5px;padding:6px 10px;border-radius:8px;cursor:pointer">Logout</button>
</div>

<div class="wrap">
  <div class="bar">
    <input id="q" placeholder="🔍 Naam / product / city dhoondo…" oninput="render()">
    <button class="btn b-cfg" onclick="toggleCfg()">⚙️ Setup</button>
    <a class="btn b-nav" href="/">🏠 Home</a>
  </div>
  <div class="cfg" id="cfg">
    <label>Leads CSV link (Sheet ki "Leads" tab → Publish to web → CSV):</label>
    <input id="csvUrl" placeholder="https://docs.google.com/…/pub?gid=…&single=true&output=csv">
    <label>Products CSV link (price auto-fill ke liye — default already set):</label>
    <input id="prodUrl" placeholder="products CSV link">
    <label>Gmail account no. (jismein aquazone350 khulta ho — aksar 0):</label>
    <input id="gU" type="number" min="0" value="0" style="width:90px">
    <br><button onclick="saveCfg()">Save</button>
  </div>
  <div class="count" id="count"></div>
  <div id="list"><div class="loading">Leads load ho rahi hain…</div></div>
</div>

<!-- reply modal -->
<div class="ov" id="ov" onclick="if(event.target===this)closeRp()">
  <div class="rp">
    <h3 id="rpTitle">Quick reply</h3>
    <div class="sub" id="rpSub"></div>
    <textarea id="rpText"></textarea>
    <div class="row">
      <button class="btn b-wa" onclick="sendWa()">💬 WhatsApp bhejo</button>
      <button class="btn b-em" id="rpEmail" onclick="sendEm()">✉ Email bhejo</button>
      <button class="btn b-x" onclick="closeRp()">Cancel</button>
    </div>
  </div>
</div>

<!-- quote overlay -->
<div class="qov" id="qov" onclick="if(event.target===this)closeQuote()">
  <div class="qwrap">
    <div class="qctrl">
      <div><label>Product</label><input id="qProd" class="wide" oninput="recalcQ()"></div>
      <div><label>Qty</label><input id="qQty" type="number" value="1" min="1" oninput="recalcQ()"></div>
      <div><label>Rate (₹, GST extra)</label><input id="qRate" type="number" min="0" oninput="recalcQ()"></div>
      <div class="qbtns">
        <button class="btn b-pr" onclick="printQuote()">🖨 Print</button>
        <button class="btn b-dl" onclick="downloadQuote()">📄 Download PDF</button>
        <button class="btn b-x" onclick="closeQuote()">Close</button>
      </div>
    </div>
    <div id="quoteDoc"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var PRODUCTS_CSV_DEFAULT="https://docs.google.com/spreadsheets/d/e/2PACX-1vSSwvqzlRLqyMtcXio41rcwR4jZK0aHASM0uApcARGUC-qvIn9Zvk6ywVUfSUVbO3OsjGbvzFgrikg-/pub?gid=170402937&single=true&output=csv";
var DATA=[], PRODUCTS=[], DONE={}, CUR=null;
try{ DONE=JSON.parse(localStorage.getItem('wtpe_leads_done')||'{}'); }catch(e){ DONE={}; }
var MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on');},1900);}
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function rupee(n){return '₹'+(n||0).toLocaleString('en-IN');}
function csvP(t){var R=[],r=[],c='',q=false;for(var i=0;i<t.length;i++){var ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++;}else q=false;}else c+=ch;}else{if(ch=='"')q=true;else if(ch==','){r.push(c);c='';}else if(ch=='\n'){r.push(c);R.push(r);r=[];c='';}else if(ch=='\r'){}else c+=ch;}}if(c!==''||r.length){r.push(c);R.push(r);}return R;}
function parseDt(s){var m=String(s||'').match(/(\d{1,2})-([A-Za-z]{3})\s+(\d{1,2}):(\d{2})/);if(!m)return 0;var mon=MON[m[2].toLowerCase()];if(mon===undefined)return 0;var now=new Date(),lim=now.getTime()+2*864e5;for(var y=now.getFullYear();y>=now.getFullYear()-1;y--){var ts=new Date(y,mon,+m[1],+m[3],+m[4]).getTime();if(ts<=lim)return ts;}return new Date(now.getFullYear()-1,mon,+m[1],+m[3],+m[4]).getTime();}

/* ---- product price match ---- */
function priceFor(q){
  q=String(q||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  if(!q||!PRODUCTS.length)return null;
  var qw=q.split(' ').filter(function(w){return w.length>2;});
  var best=null,bs=0;
  for(var i=0;i<PRODUCTS.length;i++){
    var n=String(PRODUCTS[i].name||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
    if(!n)continue; var sc=0;
    if(n===q)sc+=8; else if(n.indexOf(q)>-1||q.indexOf(n)>-1)sc+=4;
    var nw=n.split(' ');
    for(var j=0;j<qw.length;j++){ if(nw.indexOf(qw[j])>-1)sc+=1; }
    if(sc>bs){bs=sc;best=PRODUCTS[i];}
  }
  return bs>=2?best:null;
}
function priceLine(product){
  var p=priceFor(product);
  if(p&&p.price>0){ var s='💰 Price: '+rupee(p.price)+' + GST'; if(p.mrp&&p.mrp>p.price)s+=' (MRP '+rupee(p.mrp)+')'; return s; }
  return '💰 Best price ke liye reply karein (GST extra)';
}

/* ---- message templates ---- */
function tmpl(type,p){
  var nm=p.Name||'', pr=p.Product||'';
  if(type==='quote'){
    return 'Namaste '+nm+' 🙏\nWTPESTORE — powered by Aqua Filtration System\n\n'
      +'Aapne *'+pr+'* ke bare me enquiry ki thi.\n'+priceLine(pr)+'\n\n'
      +'Genuine product · GST invoice · pan-India delivery. Quantity aur delivery city bata dein to final quotation bhej deta hoon.\n\n'
      +'🌐 www.wtpestore.co.in\n📞 9899193589';
  }
  if(type==='details'){
    return 'Namaste '+nm+' 🙏\nWTPESTORE se dhanyavaad! *'+pr+'* ke liye sahi quotation ke liye ye batayein:\n\n'
      +'1️⃣ Quantity kitni chahiye?\n2️⃣ Capacity / Size (LPH / inch)?\n3️⃣ Delivery city / pincode?\n\n'
      +'Bata dein — turant best price bhej deta hoon.\n📞 9899193589';
  }
  return 'Namaste '+nm+' 🙏\nWTPESTORE — Aqua Filtration System\n\n'
    +'*'+pr+'* aur baaki products ka catalogue yahan:\n📘 https://www.wtpestore.co.in/catalogues.html\n🌐 www.wtpestore.co.in\n\n'
    +'Quotation chahiye to bata dein.\n📞 9899193589';
}

/* ---- reply modal ---- */
function openRp(i,type){
  var p=DATA[i];CUR=p;
  var title=type==='quote'?'📋 Quotation':(type==='details'?'❓ Details maango':'📘 Catalogue bhejo');
  document.getElementById('rpTitle').textContent=title;
  document.getElementById('rpSub').textContent=(p.Name||'')+(p.Mobile?' · 📞 '+p.Mobile:'')+(p.Email?' · ✉ '+p.Email:'');
  document.getElementById('rpText').value=tmpl(type,p);
  document.getElementById('rpEmail').style.display=p.Email?'inline-flex':'none';
  document.getElementById('ov').classList.add('on');
}
function closeRp(){document.getElementById('ov').classList.remove('on');}
function sendWa(){
  if(!CUR)return; var num=String(CUR.Mobile||'').replace(/[^0-9]/g,''); if(num.length===10)num='91'+num;
  var t=document.getElementById('rpText').value;
  if(!num){toast('Is lead ka number nahi hai — Email use karein');return;}
  window.open('https://wa.me/'+num+'?text='+encodeURIComponent(t),'_blank');markDone(CUR.QueryID);closeRp();
}
function gmailU(){try{return localStorage.getItem('wtpe_gmail_u')||'0';}catch(e){return '0';}}
function sendEm(){
  if(!CUR||!CUR.Email){toast('Email nahi hai');return;}
  var t=document.getElementById('rpText').value;
  var sub='WTPESTORE — Aapki enquiry ('+(CUR.Product||'')+')';
  var url='https://mail.google.com/mail/u/'+gmailU()+'/?view=cm&fs=1&tf=1&to='+encodeURIComponent(CUR.Email)+'&su='+encodeURIComponent(sub)+'&body='+encodeURIComponent(t);
  window.open(url,'_blank');
  toast('Gmail compose khul gaya — Send dabayein, Sent me record aa jayega');
  markDone(CUR.QueryID);closeRp();
}

function call(i){var p=DATA[i];var num=String(p.Mobile||'').replace(/[^0-9+]/g,'');if(!num){toast('Number nahi hai');return;}location.href='tel:'+num;}
function markDone(id){DONE[id]=1;try{localStorage.setItem('wtpe_leads_done',JSON.stringify(DONE));}catch(e){}render();}
function undo(id){delete DONE[id];try{localStorage.setItem('wtpe_leads_done',JSON.stringify(DONE));}catch(e){}render();}

function toggleCfg(){var c=document.getElementById('cfg');c.classList.toggle('on');document.getElementById('csvUrl').value=localStorage.getItem('wtpe_leads_csv')||'';document.getElementById('prodUrl').value=localStorage.getItem('wtpe_products_csv')||PRODUCTS_CSV_DEFAULT;document.getElementById('gU').value=localStorage.getItem('wtpe_gmail_u')||'0';}
function saveCfg(){var u=document.getElementById('csvUrl').value.trim();var pu=document.getElementById('prodUrl').value.trim();var gu=document.getElementById('gU').value.trim();if(u)localStorage.setItem('wtpe_leads_csv',u);if(pu)localStorage.setItem('wtpe_products_csv',pu);localStorage.setItem('wtpe_gmail_u',gu||'0');document.getElementById('cfg').classList.remove('on');toast('Saved!');loadProducts();loadLeads();}

function render(){
  var q=(document.getElementById('q').value||'').toLowerCase().trim();
  var list=DATA.filter(function(p){return !q||((p.Name+' '+p.Product+' '+p.City+' '+p.Company).toLowerCase().indexOf(q)>-1);});
  document.getElementById('count').textContent=list.length+' leads'+(Object.keys(DONE).length?(' · '+Object.keys(DONE).length+' contacted'):'');
  var el=document.getElementById('list');
  if(!list.length){el.innerHTML='<div class="loading">Koi lead nahi mili.</div>';return;}
  el.innerHTML=list.map(function(p){
    var idx=DATA.indexOf(p), done=!!DONE[p.QueryID];
    var meta=[]; if(p.Mobile)meta.push('📞 '+esc(p.Mobile)); if(p.Email)meta.push('✉ '+esc(p.Email)); if(p.City)meta.push('📍 '+esc(p.City)+(p.State?', '+esc(p.State):'')); if(p.Company)meta.push('🏢 '+esc(p.Company));
    var msg=(p.Message||'').replace(/\s+/g,' ').trim(); if(msg.length>140)msg=msg.slice(0,140)+'…';
    var noC=(!p.Mobile&&!p.Email);
    return '<div class="lead'+(done?' done':'')+'">'
      +'<div class="l-top"><div class="l-name">'+esc(p.Name||'Customer')+'</div><div class="l-date">'+esc(p.Date||'')+'</div></div>'
      +'<div class="l-prod">🛒 '+esc(p.Product||'')+'</div>'
      +(meta.length?'<div class="l-meta">'+meta.join(' · ')+'</div>':'')
      +(noC?'<span class="pill n">IndiaMART ne contact nahi diya — lead kholo</span>':'')
      +(msg?'<div class="l-msg">'+esc(msg)+'</div>':'')
      +'<div class="l-btns">'
      +'<button class="btn b-q" onclick="openRp('+idx+',\'quote\')">📋 Quotation</button>'
      +'<button class="btn b-d" onclick="openRp('+idx+',\'details\')">❓ Details</button>'
      +'<button class="btn b-c" onclick="openRp('+idx+',\'cat\')">📘 Catalogue</button>'
      +'<button class="btn b-pdf" onclick="openQuote('+idx+')">📄 Quote PDF</button>'
      +'<button class="btn b-cl" onclick="call('+idx+')">📞 Call</button>'
      +(p.Email?'<button class="btn b-em" onclick="openRp('+idx+',\'quote\')">✉ Email</button>':'')
      +(done?'<button class="btn b-ok" onclick="undo(\''+p.QueryID+'\')">↩ Undo</button>':'<button class="btn b-ok" onclick="markDone(\''+p.QueryID+'\')">✅ Contacted</button>')
      +'</div></div>';
  }).join('');
}

/* ---- load products (for auto-price) ---- */
function loadProducts(){
  var url=localStorage.getItem('wtpe_products_csv')||PRODUCTS_CSV_DEFAULT;
  fetch(url).then(function(r){return r.text();}).then(function(t){
    var rows=csvP(t).filter(function(r){return r.join('').trim();}); if(rows.length<2)return;
    var h=rows[0].map(function(x){return String(x||'').replace(/^\uFEFF/,'').trim().toLowerCase();});
    function ix(){for(var k=0;k<arguments.length;k++){var i=h.indexOf(arguments[k]);if(i>-1)return i;}return -1;}
    var ni=ix('product','name'),pi=ix('price'),mi=ix('mrp','list price','old price'),di=ix('discount','disc','off');
    if(ni<0)return; var out=[];
    for(var i=1;i<rows.length;i++){var r=rows[i];var nm=(r[ni]||'').trim();if(nm.length<2)continue;
      var o={name:nm,price:parseInt((r[pi]||'').replace(/[^0-9]/g,''))||0,mrp:(mi>-1?parseInt(String(r[mi]||'').replace(/[^0-9]/g,''))||0:0)};
      if(o.mrp&&o.mrp<=o.price)o.mrp=0;
      if(!o.mrp&&di>-1&&r[di]){var d=parseFloat(String(r[di]||'').replace(/[^0-9.]/g,''))||0;if(d>0&&d<95&&o.price>0){o.mrp=o.price;o.price=Math.round(o.price*(100-d)/100);}}
      out.push(o);}
    PRODUCTS=out;
  }).catch(function(){});
}

function loadLeads(){
  var url=localStorage.getItem('wtpe_leads_csv');var el=document.getElementById('list');
  if(!url){el.innerHTML='<div class="loading">Pehle ⚙️ Setup me "Leads" tab ka CSV link daalein.</div>';document.getElementById('cfg').classList.add('on');return;}
  el.innerHTML='<div class="loading">Leads load ho rahi hain…</div>';
  fetch(url).then(function(r){return r.text();}).then(function(t){
    var rows=csvP(t).filter(function(r){return r.join('').trim();});
    if(rows.length<2){el.innerHTML='<div class="loading">Abhi koi lead nahi.</div>';DATA=[];render();return;}
    var h=rows[0].map(function(x){return String(x||'').replace(/^\uFEFF/,'').trim();});
    var out=[];
    for(var i=1;i<rows.length;i++){var o={};for(var j=0;j<h.length;j++){o[h[j]]=(rows[i][j]||'').trim();}if(o.Name||o.Mobile||o.Email)out.push(o);}
    out.sort(function(a,b){return parseDt(b.Date)-parseDt(a.Date);});
    DATA=out;render();
  }).catch(function(){el.innerHTML='<div class="loading">Leads load nahi hui. CSV link check karein.</div>';});
}


/* ================= Quote PDF / Preview ================= */
var QCUR=null;
function openQuote(i){
  var p=DATA[i]; QCUR=p;
  document.getElementById('qProd').value = p.Product || '';
  document.getElementById('qQty').value = 1;
  var pr = priceFor(p.Product); document.getElementById('qRate').value = (pr && pr.price>0) ? pr.price : '';
  recalcQ();
  document.getElementById('qov').classList.add('on');
}
function closeQuote(){ document.getElementById('qov').classList.remove('on'); }
function recalcQ(){
  var p=QCUR||{}; 
  var prod=document.getElementById('qProd').value||'Product';
  var qty=parseFloat(document.getElementById('qQty').value)||0;
  var rate=parseFloat(document.getElementById('qRate').value)||0;
  var amt=Math.round(qty*rate), gst=Math.round(amt*0.18), tot=amt+gst;
  var d=new Date();
  var qno='WTPE-Q-'+d.getFullYear().toString().slice(2)+pad(d.getMonth()+1)+pad(d.getDate())+'-'+(String(p.Mobile||'').replace(/[^0-9]/g,'').slice(-4)||'000');
  var dt=pad(d.getDate())+'-'+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+'-'+d.getFullYear();
  var to=[esc(p.Name||'Customer')]; if(p.Company)to.push(esc(p.Company)); if(p.City)to.push(esc(p.City)+(p.State?', '+esc(p.State):'')); if(p.Mobile)to.push('📞 '+esc(p.Mobile)); if(p.Email)to.push('✉ '+esc(p.Email));
  document.getElementById('quoteDoc').innerHTML =
    '<div class="hd"><div class="co">WTPESTORE<small>powered by Aqua Filtration System</small></div>'
    +'<div class="muted" style="text-align:right">B-198, Royal Plaza, Green Field,<br>Faridabad – 121001, Haryana<br>GSTIN: 06DMUPS2289L1ZZ<br>📞 9899193589 · 🌐 www.wtpestore.co.in</div></div>'
    +'<div style="display:flex;justify-content:space-between"><div><b>To:</b><br>'+to.join('<br>')+'</div>'
    +'<div style="text-align:right" class="muted"><b>Quotation No:</b> '+qno+'<br><b>Date:</b> '+dt+'</div></div>'
    +'<h2>QUOTATION</h2>'
    +'<table><tr><th>#</th><th>Product / Description</th><th class="r">Qty</th><th class="r">Rate (₹)</th><th class="r">Amount (₹)</th></tr>'
    +'<tr><td>1</td><td>'+esc(prod)+'</td><td class="r">'+qty+'</td><td class="r">'+rate.toLocaleString("en-IN")+'</td><td class="r">'+amt.toLocaleString("en-IN")+'</td></tr>'
    +'<tr><td colspan="4" class="r">Sub Total</td><td class="r">'+amt.toLocaleString("en-IN")+'</td></tr>'
    +'<tr><td colspan="4" class="r">GST @ 18%</td><td class="r">'+gst.toLocaleString("en-IN")+'</td></tr>'
    +'<tr class="tot"><td colspan="4" class="r">Grand Total</td><td class="r">₹'+tot.toLocaleString("en-IN")+'</td></tr></table>'
    +'<div class="terms"><b>Terms &amp; Conditions:</b><br>'
    +'• Prices inclusive of GST as shown. • Delivery: 3–7 working days after order confirmation. • Payment: NEFT / RTGS / Bank Transfer.<br>'
    +'• Bank: Axis Bank · IFSC UTIB0002693 (A/C details on request). • Quotation valid for 15 days.<br><br>'
    +'For <b>Aqua Filtration System</b><br><br>Authorised Signatory</div>';
}
function pad(n){return (n<10?'0':'')+n;}
function fnameQ(){ return 'Quotation-'+String((QCUR&&QCUR.Name)||'customer').replace(/[^A-Za-z0-9]+/g,'-')+'.pdf'; }
function downloadQuote(){
  var el=document.getElementById('quoteDoc');
  if(typeof html2pdf==='undefined'){ toast('PDF library load nahi hui — Print se Save-as-PDF karein'); printQuote(); return; }
  toast('PDF ban rahi hai…');
  html2pdf().set({margin:8,filename:fnameQ(),image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from(el).save();
}
function printQuote(){
  var w=window.open('','_blank');
  w.document.write('<html><head><title>Quotation</title></head><body>'+document.getElementById('quoteDoc').outerHTML+'</body></html>');
  w.document.close(); setTimeout(function(){w.print();},400);
}

/* ===== Admin login (same token as other admin tools) ===== */
function aJsonp2(url,cb){var done=false;var fn='wcb_'+Math.floor(Math.random()*1e9);var sc=document.createElement('script');
function fin(r){if(done)return;done=true;try{cb(r);}finally{try{delete window[fn];sc.remove();}catch(e){}}}
window[fn]=function(r){fin(r);};sc.src=url+(url.indexOf('?')<0?'?':'&')+'callback='+fn;
sc.onerror=function(){fin({ok:false,error:'network'});};document.body.appendChild(sc);
setTimeout(function(){fin({ok:false,error:'timeout'});},12000);}
var LOGIN_URL_DEFAULT="https://script.google.com/macros/s/AKfycbzzi3a8MZGV5_f-nt-hYA29OCn50ir3KD8WX66mNJTn4dhzOKYr1zkAv5w9aYlXD2dG/exec";
function cfgLogin(){try{return localStorage.getItem('wtpe_login_url')||localStorage.getItem('wtpe_addproduct_url')||localStorage.getItem('wtpe_lead')||localStorage.getItem('wtpe_quote_url')||LOGIN_URL_DEFAULT;}catch(e){return LOGIN_URL_DEFAULT;}}
function setWhoAmI(name){
  var el=document.getElementById('whoami');
  el.textContent = name ? ('Logged in as: '+name+' · quick reply (auto-price) · WhatsApp / Email') : 'Owner tool · quick reply (auto-price) · WhatsApp / Email';
}
function logout(){ try{localStorage.removeItem('wtpe_admin_token');localStorage.removeItem('wtpe_admin_name');}catch(e){} location.reload(); }
function unlock(){
  var nm=(document.getElementById('uName').value||'').trim();
  var pass=document.getElementById('pin').value;var url=cfgLogin();var errEl=document.getElementById('pinerr');
  if(!url){errEl.textContent='Login URL set nahi hai. Pehle admin Settings me daalein.';errEl.style.display='block';return;}
  if(!nm){errEl.textContent='Apna naam daalein';errEl.style.display='block';return;}
  errEl.style.display='none';var btn=document.querySelector('#gate button');if(btn){btn.disabled=true;btn.textContent='Checking...';}
  aJsonp2(url+'?action=login&user='+encodeURIComponent(nm)+'&pass='+encodeURIComponent(pass),function(d){
    if(btn){btn.disabled=false;btn.textContent='Unlock';}
    if(d&&d.ok&&d.token){try{localStorage.setItem('wtpe_admin_token',d.token);localStorage.setItem('wtpe_admin_name',d.name||nm);}catch(e){}document.getElementById('gate').style.display='none';setWhoAmI(d.name||nm);afterUnlock();}
    else{errEl.textContent=(d&&d.error==='no-password-set')?'Sheet ki AdminAuth tab me naam/password daalein':((d&&(d.error==='network'||d.error==='timeout'))?'Login server se connect nahi hua':'Naam ya password galat hai');errEl.style.display='block';}
  });
}
function checkSavedToken(){var url=cfgLogin();var tok='';try{tok=localStorage.getItem('wtpe_admin_token')||'';}catch(e){}
  if(!url||!tok)return;aJsonp2(url+'?action=verify&token='+encodeURIComponent(tok),function(d){if(d&&d.ok){document.getElementById('gate').style.display='none';var nm=d.name||(function(){try{return localStorage.getItem('wtpe_admin_name')||'';}catch(e){return '';}})();setWhoAmI(nm);afterUnlock();}});}
var _loaded=false;function afterUnlock(){if(_loaded)return;_loaded=true;loadProducts();loadLeads();}
window.addEventListener('load',checkSavedToken);
</script>
